[project]
name = "jev-triage"
version = "0.1.0"
description = "GitHub triage bot that only acts when Jev's calibrated confidence clears your threshold."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
