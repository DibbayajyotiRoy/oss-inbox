# cp .env.example .env && docker compose up -d --build   (docs/self-hosting.md)
x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-jev}:${POSTGRES_PASSWORD:-jev}@postgres:5432/${POSTGRES_DB:-jev}
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jev}
      POSTGRES_DB: ${POSTGRES_DB:-jev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jev} -d ${POSTGRES_DB:-jev}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
      SETUP_ENV_PATH: /app/.env  # where /api/setup writes the GitHub App credentials
    volumes:
      - ./.env:/app/.env  # create it first: cp .env.example .env
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./.env:/app/.env:ro

  dashboard:
    build:
      context: ./dashboard
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
